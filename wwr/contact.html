<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Rapids White Water Rafting</title>

    <meta name="description"
      content="Contact Rapids White Water Rafting for information about our rafting adventures, reservations, and services.">

    <meta name="author" content="Hubert Abedi Amoah">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Rapids Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-company">

            <h1>White Water Rafting Company</h1>

            <p>
                45 Riverbend Road<br>
                Accra, Ghana<br>
                +233 20 555 0147<br>
                info@rapidswhitewater.com
            </p>

        </section>

        <section class="contact-content">

            <div class="map-container">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31761.104796504544!2d0.07771269285891336!3d5.693177601337863!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10207d9ecb000003%3A0xd5dd3885c8b9037e!2sOcean%20Green%20Beach%20Resort!5e0!3m2!1sen!2sgh!4v1791035275797!5m2!1sen!2sgh"
                  allowfullscreen="" loading="lazy">
                </iframe>

            </div>

            <form class="contact-form">

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..."
                      required></textarea>
                </div>

                <label class="newsletter" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employee-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Rapids rafting manager">
                    <figcaption>General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Rapids rafting guide">
                    <figcaption>Senior Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer service employee">
                    <figcaption>Customer Service Coordinator</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Rapids White Water Rafting | Hubert Abedi Amoah</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>

            <a href="https://x.com">
                <img src="images/twitter.svg" alt="X social media icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>

        </nav>

    </footer>

</body>

</html>
